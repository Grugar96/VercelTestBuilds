<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan your stay — Mulki Surf Brothers</title>
<meta name="description" content="Choose surf lessons, a riverside bed or a Surf + Stay package in Mulki and send your booking request on WhatsApp.">
<meta name="theme-color" content="#F5F3EC">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Oswald:wght@500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="book">
<div data-header></div>
<main id="main" class="book-page">
  <div class="wrap">
    <p class="label">Mulki Surf Brothers · booking request</p>
    <h1>Plan your stay</h1>
    <p class="muted" style="margin:0">One choice at a time. Nothing is charged here: we confirm availability and the final price with you on WhatsApp.</p>
    <ol class="stepper" aria-label="Booking steps"></ol>
    <div class="book-grid">
      <section class="step-panel" aria-live="polite"></section>
      <aside class="summary" aria-label="Booking summary"></aside>
    </div>
  </div>
</main>
<div class="mobile-bar" aria-label="Booking total">
  <div class="breakdown"></div>
  <div class="row">
    <button class="tot" type="button" aria-expanded="false"><b>₹0</b><span>See breakdown</span></button>
    <button class="btn btn-primary" type="button" data-next>Continue</button>
  </div>
</div>
<div data-footer></div>
<script src="assets/js/main.js"></script>
<script src="assets/js/book.js"></script>
</body>
</html>
